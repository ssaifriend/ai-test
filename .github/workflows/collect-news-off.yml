name: 뉴스 수집 (Off Hours)

on:
  schedule:
    # 한국 시간 기준 20:00-08:00 (다음날), 매 30분마다 실행
    # UTC 기준으로는 11:00-23:00 (KST = UTC+9)
    # Peak/Active 시간을 제외한 시간대만 실행
    # Peak: UTC 0-5시 (매 5분), Active: UTC 23,0,6,7-10,11시
    - cron: "30 11 * * 1-5"  # 월-금 11:30 (KST 20:30) - Active 직후 시작
    - cron: "*/30 12-22 * * *"  # 매일 12:00-22:59 (KST 21:00-07:59) - 매 30분
    - cron: "0,30 23 * * *"  # 매일 23:00,23:30 (KST 08:00,08:30 다음날) - Active 전까지
  workflow_dispatch: # 수동 실행 가능

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call collect-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-news" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json"

      - name: Call filter-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/filter-news" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json"

      - name: Call collect-full-content Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-full-content" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" || true

