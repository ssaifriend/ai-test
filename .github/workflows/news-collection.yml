name: News Collection

on:
  schedule:
    # Peak Hours: 09:00-15:30 KST (00:00-06:30 UTC) - Every 5 minutes
    - cron: "*/5 0-5 * * 1-5"   # UTC 00:00-05:59 (KST 09:00-14:59)
    - cron: "0,5,10,15,20,25,30 6 * * 1-5"  # UTC 06:00-06:30 (KST 15:00-15:30)

    # Active Hours: 08:00-09:00, 15:30-20:00 KST - Every 15 minutes
    - cron: "0,15,30,45 23 * * 0-4"  # Sun-Thu 23:00-23:59 (Mon-Fri 08:00-08:59 KST)
    - cron: "0 0 * * 1-5"  # Mon-Fri 00:00 (09:00 KST)
    - cron: "30,45 6 * * 1-5"  # Mon-Fri 06:30,06:45 (15:30,15:45 KST)
    - cron: "*/15 7-10 * * 1-5"  # Mon-Fri 07:00-10:59 (16:00-19:59 KST)
    - cron: "0 11 * * 1-5"  # Mon-Fri 11:00 (20:00 KST)

    # Off Hours: 20:00-08:00 KST - Every 30 minutes
    - cron: "30 11 * * 1-5"  # Mon-Fri 11:30 (20:30 KST)
    - cron: "*/30 12-22 * * *"  # Daily 12:00-22:59 (21:00-07:59 KST)
    - cron: "0,30 23 * * *"  # Daily 23:00,23:30 (08:00,08:30 KST next day)

  workflow_dispatch:

jobs:
  collect-news:
    name: Collect News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call collect-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-news" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300 \
            --fail-with-body

      - name: Call filter-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/filter-news" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300 \
            --fail-with-body

      - name: Call collect-full-content Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-full-content" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300 \
            --fail-with-body || true
