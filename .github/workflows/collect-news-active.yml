name: 뉴스 수집 (Active Hours)

on:
  schedule:
    # 한국 시간 기준 08:00-09:00, 15:30-20:00, 매 15분마다 실행
    # UTC 기준으로는 23:00-00:00, 06:30-11:00 (KST = UTC+9)
    # 08:00-09:00 KST = 23:00 (전날)-00:00 UTC
    - cron: "0,15,30,45 23 * * 0-4"  # 일-목 23:00-23:59 (월-금 KST 08:00-08:59)
    - cron: "0 0 * * 1-5"  # 월-금 00:00 (KST 09:00)
    # 15:30-20:00 KST = 06:30-11:00 UTC
    - cron: "30,45 6 * * 1-5"  # 월-금 06:30,06:45 (KST 15:30,15:45)
    - cron: "*/15 7-10 * * 1-5"  # 월-금 07:00-10:59 (KST 16:00-19:59) - 매 15분
    - cron: "0 11 * * 1-5"  # 월-금 11:00 (KST 20:00)
  workflow_dispatch: # 수동 실행 가능

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call collect-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-news" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json"

      - name: Call filter-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/filter-news" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json"

      - name: Call collect-full-content Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/collect-full-content" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" || true

