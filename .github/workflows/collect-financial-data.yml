name: Collect Financial Data

on:
  schedule:
    # 매 1시간마다 실행 (매시 정각)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run financial data collection'
        required: false
        default: 'false'

jobs:
  collect-financial-data:
    name: Collect Financial Data
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/collect-financial-data" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
