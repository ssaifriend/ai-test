name: Multi-Agent Analysis

on:
  schedule:
    # Daily at 18:00 KST (09:00 UTC) - After market close
    - cron: "0 9 * * 1-5" # Mon-Fri only
  workflow_dispatch:

jobs:
  multi-agent-analysis:
    name: Run Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze sentiment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/analyze-sentiment" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 600 \
            --fail-with-body || true

      - name: Run multi-agent analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST \
            "$SUPABASE_URL/functions/v1/multi-agent-analysis" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 1200 \
            --fail-with-body

