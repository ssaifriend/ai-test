name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "scripts/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  check-scripts:
    name: Check Deno Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.40.0

      - name: Type check all scripts
        run: |
          # Utils
          deno check scripts/utils/env.ts
          deno check scripts/utils/error-handler.ts
          deno check scripts/utils/kis-api.ts
          deno check scripts/utils/technical-indicators.ts

          # Core types
          deno check scripts/types.ts

          # Main scripts
          deno check scripts/collect-news.ts
          deno check scripts/filter-news.ts
          deno check scripts/analyze-sentiment.ts
          deno check scripts/collect-full-content.ts
          deno check scripts/multi-agent-analysis.ts

          # Services
          deno check scripts/services/smart-data-collector.ts
          deno check scripts/services/sentiment-analyzer.ts

          # Agents
          deno check scripts/agents/fundamental.agent.ts
          deno check scripts/agents/technical.agent.ts
          deno check scripts/agents/news.agent.ts
          deno check scripts/agents/macro.agent.ts
          deno check scripts/agents/risk.agent.ts
          deno check scripts/agents/synthesis.agent.ts

          # Test scripts
          deno check scripts/test-openai.ts
          deno check scripts/test-naver.ts
          deno check scripts/test-supabase.ts

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: check-scripts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Deploy collect-news function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy collect-news --no-verify-jwt

      - name: Deploy filter-news function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy filter-news --no-verify-jwt

      - name: Deploy analyze-sentiment function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy analyze-sentiment --no-verify-jwt

      - name: Deploy collect-full-content function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy collect-full-content --no-verify-jwt

      - name: Deploy multi-agent-analysis function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy multi-agent-analysis --no-verify-jwt
